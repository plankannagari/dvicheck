spring:
  application:
    name: dvicheck-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/dvicheck_dev
    username: dvicheck_user
    password: dvicheck_pass_dev
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

logging:
  level:
    com.dvicheck: DEBUG
    org.springframework.security: INFO

dvicheck:
  jwt:
    # TODO: override via JWT_SECRET env var in every real environment — this dev default must never reach prod
    secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-please-32-bytes-min}
    expiration-ms: 3600000 # 1 hour
    refresh-expiration-ms: 2592000000 # 30 days
  supabase:
    url: ${SUPABASE_URL:https://dvicheck.supabase.co}
    # Dev-only placeholder — SupabaseAuthClient is unused while AuthService runs in dev-OTP-stub mode.
    # Override via env var with a real key before wiring real Supabase calls back in.
    anon-key: ${SUPABASE_ANON_KEY:placeholder-key}
  google:
    vision:
      # Real key lives in GOOGLE_VISION_API_KEY (local shell env / Railway env var) — never commit it here.
      api-key: ${GOOGLE_VISION_API_KEY:}

app:
  anthropic:
    # Real key lives in ANTHROPIC_API_KEY (local shell env / Railway env var) — never commit it here.
    api-key: ${ANTHROPIC_API_KEY:placeholder}
    # claude-sonnet-4-20250514 (the model this project was originally built against) has been
    # retired by Anthropic — verified via direct API call returning 404 not_found_error.
    model: claude-sonnet-5
    max-tokens: 1024
  google:
    gemini:
      # Real key lives in GEMINI_API_KEY (local shell env / Railway env var) — never commit it here.
      api-key: ${GEMINI_API_KEY:placeholder}
      model: gemini-1.5-flash
  ai:
    use-gemini-analyser: true  # set false to use Claude